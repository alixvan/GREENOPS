version: '3.8'

networks:
  frontend-net:
  backend-net:
  db-net:

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: greenops_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    restart: always

  redis_cache:
    image: redis:7-alpine
    container_name: greenops_redis
    networks:
      - backend-net
    restart: always

  backend-auth:
    build: ./backend-auth
    container_name: greenops_auth
    environment:
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - backend-net
      - db-net
    depends_on:
      - postgres_db

  backend-metrics:
    build: ./backend-metrics
    container_name: greenops_metrics
    networks:
      - backend-net
      - db-net
    depends_on:
      - postgres_db
      - redis_cache

  frontend:
    build: ./frontend
    container_name: greenops_frontend
    networks:
      - frontend-net

  reverse_proxy:
    image: nginx:alpine
    container_name: greenops_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - frontend
      - backend-auth
      - backend-metrics

  prometheus:
    image: prom/prometheus:latest
    container_name: greenops_prometheus
    volumes:
      - prometheus_data:/prometheus
    networks:
      - backend-net
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: greenops_grafana
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend-net
    restart: always